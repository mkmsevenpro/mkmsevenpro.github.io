<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk MKM SevenPro</title>
    <!-- Einbinden einer modernen Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Die Box sorgt nun dafür, dass alle Inhalte untereinander stehen */
        .feedback-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px; /* Begrenzt die Breite der Box für ein schöneres Design */
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            color: #333333;
            margin: 0 0 10px 0;
        }

        p {
            color: #666666;
            font-size: 14px;
            margin: 0 0 25px 0;
        }

        #zammad-feedback-form {
            background-color: #e6e3a5;
            color: black;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%; /* Das Formular nutzt die Breite der Box */
            box-sizing: border-box;
        }

        #zammad-feedback-form:hover {
            background-color: #d8d493; /* Leicht dunklerer Ton für den Hover-Effekt */
        }
    </style>
</head>
<body>

    <!-- ALLE HTML-ELEMENTE GEHÖREN IN DIESEN CONTAINER -->
    <div class="feedback-container">
        <h1>IT-Support MKM SevenPro</h1>
        <p>Bitte erstellen Sie ein neues Ticket mithilfe des Kontaktformulars.</p>
        
        <div id="zammad-feedback-form">Formular wird geladen...</div>
    </div>

    <!-- Scripts am Ende der Seite belassen -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script id="zammad_form_script" src="https://mkm-sevenpro-service.zammad.com/assets/form/form.js"></script>

    <script>
    $(function() {
      $('#zammad-feedback-form').ZammadForm({
        messageTitle: 'Kontaktformular',
        messageSubmit: 'Übermitteln',
        messageThankYou: 'Vielen Dank für Ihre Anfrage (#%s). Wir melden uns umgehend.',
        showTitle: true,
        attachmentSupport: true
      });
    });
    </script>

</body>
</html>
