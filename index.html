<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk MKM SevenPro</title>
    <!-- Einbinden einer modernen Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100vh;
        }

        .feedback-container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 24px;
            color: #333333;
            margin-bottom: 10px;
        }

        p {
            color: #666666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        #zammad-feedback-form {
            background-color: #e6e3a5;
            color: black;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        #zammad-feedback-form:hover {
            background-color: #e6e3a5;
        }

    </style>
</head>
<body>
    <h1>IT-Support MKM SevenPro</h1>
  <p>Bitte erstellen Sie ein neues Ticket mithilfe des Kontaktformulars.</p>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

   <div id="zammad-feedback-form">form will be placed in here</div>

<script id="zammad_form_script" src="https://mkm-sevenpro-service.zammad.com/assets/form/form.js"></script>

<script>
$(function() {
  $('#zammad-feedback-form').ZammadForm({
    messageTitle: 'Kontaktformular',
    messageSubmit: 'Übermitteln',
    messageThankYou: 'Vielen Dank für Ihre Anfrage (#%s). Wir melden uns umgehend.',
    showTitle: true,
    attachmentSupport: true
  });
});
</script>

</body>
</html>
